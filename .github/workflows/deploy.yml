name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build client artifact
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Build admin artifact
        working-directory: admin
        run: |
          npm ci
          npm run build

      - name: Package release artifacts
        shell: bash
        run: |
          mkdir -p release/client release/admin release/server
          cp -R client/dist/. release/client/
          cp -R admin/dist/. release/admin/
          cp server/package.json server/package-lock.json server/index.js release/server/
          tar -czf viraladlibrary-${GITHUB_SHA}.tar.gz release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: viraladlibrary-${{ github.sha }}
          path: viraladlibrary-${{ github.sha }}.tar.gz
          retention-days: 14

      - name: Load VPS SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy application over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "cd '$VPS_APP_PATH' && git fetch origin main && git reset --hard origin/main && npm ci --prefix server && npm ci --prefix client && npm ci --prefix admin && npm run build --prefix client && npm run build --prefix admin && pm2 restart viraladlibrary --update-env && pm2 save"

      - name: Verify deployment health
        if: ${{ secrets.PRODUCTION_HEALTHCHECK_URL != '' }}
        env:
          PRODUCTION_HEALTHCHECK_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$PRODUCTION_HEALTHCHECK_URL"; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Explain missing deployment configuration
        if: ${{ secrets.VPS_HOST == '' || secrets.VPS_USER == '' || secrets.VPS_APP_PATH == '' || secrets.VPS_SSH_KEY == '' }}
        run: |
          echo 'VPS deployment secrets are not fully configured.'
          echo 'CI passed and a release artifact was created, but the VPS deployment was not triggered.'
